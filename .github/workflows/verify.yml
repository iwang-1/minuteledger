name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v
      - run: |
          python ledger.py ingest sensors examples/corrections.jsonl
          python ledger.py changes | diff -u examples/changes.jsonl -
